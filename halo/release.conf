UPSTREAM_DESCRIPTION_FINGERPRINT="retrieve=801618db7c30a419 partial_update=79b976f276f8907a"
# The same for PageDuplicateEndpoint, whose post Halo's HaloPageDuplicateEndpoint mirrors.
UPSTREAM_DUPLICATE_FINGERPRINT="post=108f1d6b56a301a5"
# Plane's PageViewSet.partial_update (the web app's properties PATCH), which Halo's HaloAppPageViewSet mirrors.
UPSTREAM_PAGE_FINGERPRINT="partial_update=5d4b444f0c980013"
# Plane's page copy task and the helpers Halo's finish_page_copy uses instead of it (bgtasks/copy_s3_object.py).
UPSTREAM_COPY_FINGERPRINT="copy_s3_objects_of_description_and_assets=a1e40cf64899e18c copy_assets=bf974ed70851d5c5 extract_asset_ids=8a4e745092d96f62 replace_asset_ids=9f328e423d896d02"
# Plane's mention indexing: the whole task module (halo/index_callers.py module-hash), Plane's web create, and
# every caller of the task (halo/index_callers.py callers).
UPSTREAM_INDEX_FINGERPRINT="c23e84bc46a541f1"
UPSTREAM_CREATE_FINGERPRINT="create=7ed32a710ab83601"
UPSTREAM_INDEX_CALLERS="app/views/page/base.py:PageDuplicateEndpoint.post app/views/page/base.py:PageViewSet.create app/views/page/base.py:PageViewSet.partial_update app/views/page/base.py:PagesDescriptionViewSet.partial_update"
